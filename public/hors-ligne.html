<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd02f" />
    <title>Hors ligne — Hovly</title>
    <style>
      :root {
        --ink: #050038;
        --brand: #ffd02f;
        --slate: #555a6a;
        --surface: #f7f8fa;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--surface);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        text-align: center;
      }
      .carte {
        max-width: 22rem;
        background: #fff;
        border: 1px solid #e0e2e8;
        border-radius: 32px;
        padding: 40px 28px;
      }
      .pastille {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: var(--brand);
        font-size: 26px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 500;
      }
      p {
        margin: 0 0 24px;
        color: var(--slate);
        font-size: 15px;
        line-height: 1.5;
      }
      button {
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: #fff;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        padding: 12px 24px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="carte">
      <div class="pastille">📡</div>
      <h1>Pas de connexion</h1>
      <p>
        Hovly a besoin du réseau pour charger tes biens et suivre les prix. Tes données sont intactes,
        elles reviendront dès que tu seras reconnecté.
      </p>
      <button onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
