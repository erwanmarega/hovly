name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : @nuxtjs/supabase exige ces variables au build,
      # aucun appel réseau n'est fait pendant la CI.
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
