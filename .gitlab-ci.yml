# Pipeline GitLab CI/CD de Hovly
#
#   check  : lint, typecheck, tests unitaires (en parallèle)
#   build  : images Docker web + cron, poussées dans le Container Registry GitLab
#
# Les images ne sont poussées que sur `main` et sur les tags. Sur une merge
# request, elles sont seulement construites, pour vérifier que le Dockerfile
# passe sans polluer le registry.

workflow:
  rules:
    # Pas de pipeline en double quand une branche a une MR ouverte
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - build

variables:
  # Valeurs factices : `nuxt prepare` (postinstall) et les tests ont seulement
  # besoin que ces variables existent. Aucune vraie clé dans la CI.
  SUPABASE_URL: https://ci.supabase.co
  SUPABASE_KEY: ci-anon-key
  NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.npm
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NPM_CONFIG_FUND: "false"

default:
  interruptible: true

# ---------------------------------------------------------------------------
# check
# ---------------------------------------------------------------------------

.node:
  stage: check
  # Même version de Node que l'image de production (Dockerfile)
  image: node:24-bookworm-slim
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --prefer-offline

lint:
  extends: .node
  script:
    - npm run lint

typecheck:
  extends: .node
  script:
    - npm run typecheck
  # Non bloquant : erreurs de types préexistantes (scraper non typé, client
  # Supabase sans types générés). À repasser en bloquant une fois la dette purgée.
  allow_failure: true

test:
  extends: .node
  script:
    - npx vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
  artifacts:
    when: always
    reports:
      # Affiche les résultats des tests directement dans la MR / la pipeline
      junit: junit.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# build : images Docker
# ---------------------------------------------------------------------------

.docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  needs: [lint, test]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Driver docker-container : nécessaire pour stocker le cache de build dans le registry.
    # Avec dind en TLS, buildx refuse de lire la config TLS depuis l'environnement :
    # il faut passer par un contexte Docker qui la contient.
    - docker context create ci-context
    - docker buildx create --use --driver docker-container ci-context
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_NAME"
    - TAGS="--tag $IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$TAGS --tag $IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS --tag $IMAGE:$CI_COMMIT_TAG"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        OUTPUT="--push"
        CACHE_TO="--cache-to type=registry,ref=$IMAGE:buildcache,mode=max"
      else
        # MR / autre branche : on construit seulement, sans rien pousser
        OUTPUT="--output type=cacheonly"
        CACHE_TO=""
      fi
    - docker buildx build
        --file "$DOCKERFILE"
        --cache-from "type=registry,ref=$IMAGE:buildcache"
        $CACHE_TO
        --label "org.opencontainers.image.source=$CI_PROJECT_URL"
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
        $TAGS
        $OUTPUT
        .

docker:web:
  extends: .docker
  variables:
    IMAGE_NAME: web
    DOCKERFILE: Dockerfile

docker:cron:
  extends: .docker
  variables:
    IMAGE_NAME: cron
    DOCKERFILE: Dockerfile.cron
