# Pipeline GitLab CI/CD de Hovly
#
#   check  : lint, typecheck, tests unitaires (en parallèle)
#   build  : images Docker web + cron, poussées dans le Container Registry GitLab
#   deploy : l'image web et cron du commit partent en production sur Railway (manuel)
#
# Les images ne sont poussées que sur `main` et sur les tags. Sur une merge
# request, elles sont seulement construites, pour vérifier que le Dockerfile
# passe sans polluer le registry.

workflow:
  rules:
    # Pas de pipeline en double quand une branche a une MR ouverte
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - build
  - deploy

variables:
  # Valeurs factices : `nuxt prepare` (postinstall) et les tests ont seulement
  # besoin que ces variables existent. Aucune vraie clé dans la CI.
  SUPABASE_URL: https://ci.supabase.co
  SUPABASE_KEY: ci-anon-key
  NPM_CONFIG_CACHE: $CI_PROJECT_DIR/.npm
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NPM_CONFIG_FUND: "false"

default:
  interruptible: true

# ---------------------------------------------------------------------------
# check
# ---------------------------------------------------------------------------

.node:
  stage: check
  # Même version de Node que l'image de production (Dockerfile)
  image: node:24-bookworm-slim
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --prefer-offline

lint:
  extends: .node
  script:
    - npm run lint

typecheck:
  extends: .node
  script:
    - npm run typecheck

test:
  extends: .node
  script:
    - npx vitest run --reporter=default --reporter=junit --outputFile.junit=junit.xml
  artifacts:
    when: always
    reports:
      # Affiche les résultats des tests directement dans la MR / la pipeline
      junit: junit.xml
    expire_in: 1 week

# ---------------------------------------------------------------------------
# build : images Docker
# ---------------------------------------------------------------------------

.docker:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: /certs
  needs: [lint, test]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Driver docker-container : nécessaire pour stocker le cache de build dans le registry.
    # Avec dind en TLS, buildx refuse de lire la config TLS depuis l'environnement :
    # il faut passer par un contexte Docker qui la contient.
    - docker context create ci-context
    - docker buildx create --use --driver docker-container ci-context
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_NAME"
    - TAGS="--tag $IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="$TAGS --tag $IMAGE:latest"
      fi
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS --tag $IMAGE:$CI_COMMIT_TAG"
      fi
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        OUTPUT="--push"
        CACHE_TO="--cache-to type=registry,ref=$IMAGE:buildcache,mode=max"
      else
        # MR / autre branche : on construit seulement, sans rien pousser
        OUTPUT="--output type=cacheonly"
        CACHE_TO=""
      fi
    - docker buildx build
        --file "$DOCKERFILE"
        --cache-from "type=registry,ref=$IMAGE:buildcache"
        $CACHE_TO
        --label "org.opencontainers.image.source=$CI_PROJECT_URL"
        --label "org.opencontainers.image.revision=$CI_COMMIT_SHA"
        $TAGS
        $OUTPUT
        .

docker:web:
  extends: .docker
  variables:
    IMAGE_NAME: web
    DOCKERFILE: Dockerfile

docker:cron:
  extends: .docker
  variables:
    IMAGE_NAME: cron
    DOCKERFILE: Dockerfile.cron

# ---------------------------------------------------------------------------
# deploy : production sur Railway
# ---------------------------------------------------------------------------
#
# Déploie l'image construite et testée par CETTE pipeline (tag = SHA du commit),
# jamais `latest` : GitLab sait exactement quelle version tourne, et le bouton
# « Re-deploy » d'un ancien déploiement (Operate → Environments) sert de rollback.

.railway-deploy:
  stage: deploy
  image: alpine:3.21
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      # La pipeline reste verte tant que personne n'a cliqué sur « deploy »
      allow_failure: true
  interruptible: false
  variables:
    # Identifiant Railway (pas un secret : inutile sans RAILWAY_TOKEN)
    RAILWAY_ENVIRONMENT_ID: d8685284-4291-41da-a35d-5d25333e4148
  before_script:
    - apk add --no-cache curl jq
  script:
    - sh scripts/deploy-railway.sh

deploy:production:
  extends: .railway-deploy
  needs: [docker:web]
  environment:
    name: production
    url: https://hovly-production.up.railway.app
  # Deux déploiements du même service ne tournent jamais en même temps
  resource_group: production
  variables:
    RAILWAY_SERVICE_ID: c6ddb971-8854-4eb2-bddf-0fd16d5efe91
    DEPLOY_IMAGE: $CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHORT_SHA
    DEPLOY_URL: https://hovly-production.up.railway.app/login

deploy:cron:
  extends: .railway-deploy
  needs: [docker:cron]
  environment:
    name: production/cron
  resource_group: production-cron
  variables:
    RAILWAY_SERVICE_ID: 55ef42ed-c515-48ad-9296-6240e75a821a
    DEPLOY_IMAGE: $CI_REGISTRY_IMAGE/cron:$CI_COMMIT_SHORT_SHA